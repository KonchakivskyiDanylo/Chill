# Every push and pull request: the typecheck, the game and server checks, a
# production build, and the Liquipedia and socials syncs' own tests against their fake APIs.
# Heroku only waits for this if "Wait for CI to pass before deploy" is ticked
# under Deploy → Automatic deploys.
name: Checks

on:
  push:
  pull_request:

jobs:
  site:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run check:games
      - run: npm run check:server
      - run: npm run build

  data-sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install requests
      - run: python scripts/check_liquipedia_api.py
      - run: python scripts/check_socials_api.py
